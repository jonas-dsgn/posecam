<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pose Camera</title>
<style>
:root{--g:rgba(255,255,255,.14);--gb:rgba(255,255,255,.26);--tx:#fff;--ac:#ffd60a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:#000;color:var(--tx);font:500 15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0;padding:inherit}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .35s,opacity .35s}
video.mir{transform:scaleX(-1)}video.sw{filter:blur(24px) brightness(.6)}
#grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:
linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0),
linear-gradient(transparent calc(33.33% - .5px),rgba(255,255,255,.4) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.4) 0 calc(66.66% + .5px),transparent 0)}
#grid.on{opacity:1}
#oi{position:absolute;left:50%;top:50%;pointer-events:none;transform-origin:center;will-change:transform;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35));transition:opacity .25s}
#ring{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:1.5px solid var(--ac);border-radius:50%;pointer-events:none;opacity:0}
#ring.go{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(1.5)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
.g{position:relative;background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.28);color:var(--tx)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.28),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.1))}
button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
button:active{transform:scale(.88);transition-duration:.08s}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ib svg,.pill svg{width:22px;height:22px}
.ib.on{color:#000;background:var(--ac)}
.ib.on::before{opacity:.5}
#top{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
#top .grp{display:flex;gap:10px}
#bot{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;align-items:center}
.panel{width:100%;max-width:460px;border-radius:26px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;animation:up .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.96)}}
.row{display:flex;align-items:center;gap:10px;height:38px}
.row svg{width:20px;height:20px;flex:none;opacity:.85}
.row output{width:44px;text-align:right;font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.acts{display:flex;justify-content:space-around;padding-top:2px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;opacity:.9;padding:4px 10px;background:none}
.acts svg{width:22px;height:22px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10.5px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#bar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
#shutter{width:80px;height:80px;border-radius:50%;background:transparent;border:4px solid #fff;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#shutter i{display:block;width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .15s}
#shutter:active{transform:scale(.94)}#shutter:active i{transform:scale(.88)}
#bar .ib{width:56px;height:56px}
#bar .ib svg{width:26px;height:26px}
#thumb{width:56px;height:56px;border-radius:16px;overflow:hidden;display:grid;place-items:center}
#thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:.9}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translate(-50%,-20px) scale(.9);opacity:0;pointer-events:none;padding:10px 18px;border-radius:22px;transition:.35s cubic-bezier(.2,1.3,.4,1);z-index:30;font-size:14px;white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden}
#toast.show{opacity:1;transform:translate(-50%,0)}
#status{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:28px;background:radial-gradient(120% 80% at 50% 0%,#1d2a44,#07080c 70%);text-align:center}
#status .card{max-width:340px;border-radius:32px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
#status h1{font-size:20px;margin:0;font-weight:650}
#status p{margin:0;opacity:.75;font-size:14.5px}
.pill{border-radius:999px;padding:0 22px;height:48px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pill.pr{background:#fff;color:#000;border-color:#fff}.pill.pr::before{opacity:.4}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#rev{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#rimg{flex:1;min-height:0;width:100%;object-fit:contain;padding-top:env(safe-area-inset-top,0px)}
#rctl{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#rctl .r{display:flex;gap:12px;justify-content:center;width:100%}
#info{font-size:12.5px;opacity:.6}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:12}
#flash.go{animation:fl .35s}@keyframes fl{0%{opacity:.85}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <video id="v" autoplay playsinline muted></video>
  <div id="grid"></div>
  <img id="oi" alt="" hidden draggable="false">
  <div id="ring"></div>
 </div>
 <div id="top">
  <div class="grp">
   <button class="g ib" id="bGrid" aria-label="Grid" data-i="grid"></button>
   <button class="g ib" id="bTorch" aria-label="Torch" data-i="bolt" hidden></button>
  </div>
  <button class="g ib" id="bSheet" aria-label="Camera controls" data-i="sliders" hidden></button>
 </div>
 <div id="bot">
  <div class="g panel" id="sheet" hidden>
   <div class="row" id="rZoom" hidden><svg data-i="zoom"></svg><input type="range" id="zoom"><output id="zo"></output></div>
   <div class="row" id="rExp" hidden><svg data-i="sun"></svg><input type="range" id="exp"><output id="eo"></output></div>
  </div>
  <div class="g panel" id="ovbar" hidden>
   <div class="row"><svg data-i="drop"></svg><input type="range" id="opa" min="5" max="100" value="50"><output id="oo">50%</output></div>
   <div class="acts">
    <button id="bMir"><svg data-i="mirror"></svg>Mirror</button>
    <button id="bRes"><svg data-i="reset"></svg>Reset</button>
    <button id="bHide"><svg data-i="eye"></svg>Hide</button>
    <button id="bDel"><svg data-i="x"></svg>Remove</button>
   </div>
  </div>
  <div id="bar">
   <button class="g" id="thumb" aria-label="Choose reference image"><svg data-i="image" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></button>
   <button id="shutter" aria-label="Take photo"><i></i></button>
   <button class="g ib" id="bFlip" aria-label="Switch camera" data-i="flip" hidden></button>
  </div>
 </div>
 <input type="file" id="file" accept="image/*" hidden>
 <div id="flash"></div>
 <div id="toast" class="g"></div>
 <div id="status"><div class="g card"><div class="spin"></div><h1>Starting camera…</h1><p>Allow camera access when asked.</p></div></div>
 <div id="rev" hidden>
  <img id="rimg" alt="Captured photo">
  <div id="rctl">
   <div id="info"></div>
   <div class="r">
    <button class="g pill" id="bRetake"><svg data-i="reset"></svg>Retake</button>
    <button class="g pill" id="bInc" hidden><svg data-i="layers"></svg>Overlay</button>
    <button class="g pill pr" id="bSave"><svg data-i="down"></svg>Save</button>
   </div>
  </div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s),P={
grid:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
flip:'<path d="M20 7H8a4 4 0 0 0-4 4M4 17h12a4 4 0 0 0 4-4M17 4l3 3-3 3M7 14l-3 3 3 3"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/>',
sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
mirror:'<path d="M12 3v18M8 7l-5 5 5 5zM16 7l5 5-5 5z"/>',
reset:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>',
x:'<path d="M6 6l12 12M18 6 6 18"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
zoom:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>',
layers:'<path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/>',
down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>{const n=e.dataset.i;if(e.tagName==='svg'||e.tagName==='SVG'){e.setAttribute('viewBox','0 0 24 24');e.setAttribute('fill','none');e.setAttribute('stroke','currentColor');e.setAttribute('stroke-width','1.8');e.setAttribute('stroke-linecap','round');e.setAttribute('stroke-linejoin','round');e.innerHTML=P[n]}else e.insertAdjacentHTML('afterbegin',ic(n))});
const v=$('#v'),oi=$('#oi'),stage=$('#stage');
let facing='environment',stream=null,track=null,caps={},mir=false,torch=false,shot=null,incl=false,busy=false;
const ov={x:0,y:0,s:1,r:0,o:.5,flip:false,hide:false,on:false,bw:0,bh:0};
const buzz=(n=8)=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(h,p,btn,spin,detail,open){const s=$('#status');s.hidden=false;s.firstElementChild.innerHTML=`${spin?'<div class="spin"></div>':''}<h1>${h}</h1><p>${p}</p>${btn?'<button class="g pill pr" id="sb">'+btn+'</button>':''}${open?'<a class="g pill pr" id="so" href="'+esc(location.href)+'" target="_blank" rel="noopener" style="text-decoration:none">Open full page</a><button class="g pill" id="sc">Copy link</button>':''}${detail?'<div class="g" style="padding:5px 12px;border-radius:999px;font-size:12px">'+esc(envLabel())+'</div><pre style="margin:0;max-width:100%;white-space:pre-wrap;word-break:break-word;font:11px/1.4 ui-monospace,Menlo,monospace;opacity:.55;text-align:left;-webkit-user-select:text;user-select:text">'+esc(detail)+'</pre>':''}`;if(btn)$('#sb').onclick=()=>start(false,true);if(open)$('#sc').onclick=copyLink}
let gesture=false,nd='?',starting=false;
addEventListener('pointerdown',()=>{gesture=true},{capture:true,once:true});
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const polOK=()=>{try{const p=document.permissionsPolicy||document.featurePolicy;return p&&p.allowsFeature?p.allowsFeature('camera'):true}catch(e){return true}};
const permState=async()=>{try{return(await navigator.permissions.query({name:'camera'})).state}catch(e){return'unknown'}};
let blocked=false;
const UA=navigator.userAgent,iosDev=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=!!navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
const webview=(iosDev&&!standalone&&!/Safari\//.test(UA))||/FBAN|FBAV|Instagram|Snapchat|MicroMessenger|; wv\)|GSA\//.test(UA);
const envLabel=()=>{const b=/CriOS/.test(UA)?'Chrome iOS':/FxiOS/.test(UA)?'Firefox iOS':/EdgiOS/.test(UA)?'Edge iOS':/Safari\//.test(UA)?(iosDev?'Safari':'Browser'):'WebView';const o=(UA.match(/OS (\d+[_\d]*)/)||[])[1];return[inFrame?'embedded iframe':'top-level page',standalone?'home-screen app':webview?'in-app webview':b,iosDev?'iOS '+(o||'?').replace(/_/g,'.'):'non-iOS'].join(' \u00b7 ')};
async function copyLink(){try{await navigator.clipboard.writeText(location.href);toast('Link copied \u2014 paste it into Safari');return}catch(e){}try{if(navigator.share){await navigator.share({url:location.href});return}}catch(e){if(e.name==='AbortError')return}toast('Select the link text below and copy it')}
const diag=(e,ps)=>`env=${envLabel()}
url=${location.href}
${e?(e.name||'Error')+': '+(e.message||'(no message)')+'\n':''}secure=${window.isSecureContext} embedded=${inFrame} policyAllowsCamera=${polOK()} permission=${ps} videoDevices=${nd}`;
/* ---------- camera ---------- */
function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=track=null}
const gum=c=>navigator.mediaDevices.getUserMedia(c);
async function start(sw,tap){
 if(starting)return;starting=true;if(tap)blocked=false;
 try{await init(sw,tap)}finally{starting=false;setTimeout(()=>v.classList.remove('sw'),120)}
}
function fail(e,ps,tap){
 const n=(e&&e.name)||'Error',d=diag(e,ps);
 if((n==='NotAllowedError'||n==='SecurityError')&&(inFrame||webview)&&(ps==='denied'||tap||gesture)){
  blocked=true;
  return status('Camera isn\u2019t available in this preview',inFrame?'This page is running inside an embedded preview, and iOS doesn\u2019t give embedded previews access to the camera. Open it as a full page in Safari to use the camera.':'This in-app browser doesn\u2019t allow camera access. Open the link in Safari (Share \u203a Open in Safari).','Try anyway',0,d,true);
 }
 if(n==='NotAllowedError'&&!tap&&!gesture&&ps!=='denied'&&polOK())return status('Ready to start','Tap to turn on the camera.','Start Camera',0,d);
 const m={
  NotAllowedError:inFrame?['Camera is blocked here','This page is embedded, and the embedding view may not allow camera access. Open it as a full page, then tap Start Camera.']:['Camera permission refused','Safari reports no permission. Check the aA menu › Website Settings › Camera (set to Allow), and Settings › Apps › Safari › Camera.'],
  SecurityError:['Camera blocked by security policy','The browser blocked camera use for this page. Open it as a full page over HTTPS.'],
  NotFoundError:['No camera found','No video input device is available.'],
  OverconstrainedError:['Camera settings not supported','The camera couldn’t satisfy the requested settings.'],
  NotReadableError:['Camera is busy','Another app or tab is using the camera. Close it and try again.'],
  AbortError:['Camera start interrupted','The camera didn’t start. Try again.']
 }[n]||['Couldn’t start camera','Something unexpected happened.'];
 status(m[0],m[1],'Try again',0,d,inFrame&&(n==='NotAllowedError'||n==='SecurityError'));
}
async function init(sw,tap){
 const md=navigator.mediaDevices;
 if(!md||!md.getUserMedia)return status('Camera unavailable',window.isSecureContext?'This browser doesn’t support camera access. Try Safari or Chrome.':'Camera access needs a secure (HTTPS) connection.',0,0,diag(null,'n/a'));
 if(sw)v.classList.add('sw');else status('Starting camera…','Requesting access. Allow the prompt if one appears.',0,1);
 const ps=await permState();
 stop();torch=false;$('#bTorch').classList.remove('on');
 const f={facingMode:{ideal:facing}};
 const tries=[{video:{...f,width:{ideal:4096},height:{ideal:3072}},audio:false},{video:f,audio:false},{video:true,audio:false}];
 let s=null,err=null;
 for(const c of tries){
  try{s=await gum(c);break}catch(e){err=e;if(e.name==='NotAllowedError'||e.name==='SecurityError')break}
 }
 if(!s&&err&&err.name!=='NotAllowedError'&&err.name!=='SecurityError'){
  try{
   const ds=(await md.enumerateDevices()).filter(x=>x.kind==='videoinput'&&x.deviceId);nd=ds.length;
   for(const d of ds){try{s=await gum({video:{deviceId:{exact:d.deviceId}},audio:false});break}catch(e){err=e}}
  }catch(e){}
 }
 if(!s)return fail(err,ps,tap);
 try{
  stream=s;track=s.getVideoTracks()[0];
  track.onended=()=>{if(stream===s&&$('#rev').hidden)status('Camera stopped','The camera stream ended. Restart it to continue.','Restart camera')};
  v.muted=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.srcObject=s;
  await new Promise(r=>{if(v.readyState>=1)return r();v.onloadedmetadata=r;setTimeout(r,4000)});
  try{await v.play()}catch(e){
   if(e.name==='NotAllowedError'&&!tap){stop();return status('Ready to start','Tap to start the camera preview.','Start Camera',0,diag(e,ps))}
   if(e.name!=='AbortError')throw e;
  }
  for(let i=0;i<30&&!v.videoWidth;i++)await new Promise(r=>setTimeout(r,100));
  if(!v.videoWidth)throw Object.assign(new Error('Camera opened but produced no video frames'),{name:'NoFramesError'});
  caps=track.getCapabilities?track.getCapabilities():{};
  const st=track.getSettings?track.getSettings():{};
  mir=(st.facingMode?st.facingMode==='user':facing==='user');v.classList.toggle('mir',mir);
  setupCtl(st);$('#status').hidden=true;
  try{const d=await md.enumerateDevices();nd=d.filter(x=>x.kind==='videoinput').length;$('#bFlip').hidden=nd<2}catch(e){$('#bFlip').hidden=false}
 }catch(e){stop();fail(e,ps,tap)}
}
function rng(el,c,val){el.min=c.min;el.max=c.max;el.step=c.step||(c.max-c.min)/100;el.value=val}
function setupCtl(st){
 const z=caps.zoom,e=caps.exposureCompensation;
 $('#rZoom').hidden=!(z&&z.max>z.min);$('#rExp').hidden=!(e&&e.max>e.min);
 if(!$('#rZoom').hidden){rng($('#zoom'),z,st.zoom||z.min);$('#zo').textContent=(+$('#zoom').value).toFixed(1)+'×'}
 if(!$('#rExp').hidden){rng($('#exp'),e,st.exposureCompensation||0);$('#eo').textContent=(+$('#exp').value).toFixed(1)}
 $('#bTorch').hidden=!caps.torch;
 $('#bSheet').hidden=$('#rZoom').hidden&&$('#rExp').hidden;
 if($('#bSheet').hidden)$('#sheet').hidden=true;
}
const adv=o=>track&&track.applyConstraints({advanced:[o]}).catch(()=>{});
$('#zoom').oninput=e=>{$('#zo').textContent=(+e.target.value).toFixed(1)+'×';adv({zoom:+e.target.value})};
$('#exp').oninput=e=>{$('#eo').textContent=(+e.target.value).toFixed(1);adv({exposureCompensation:+e.target.value})};
$('#bTorch').onclick=e=>{torch=!torch;e.currentTarget.classList.toggle('on',torch);adv({torch});buzz()};
$('#bGrid').onclick=e=>{const on=$('#grid').classList.toggle('on');e.currentTarget.classList.toggle('on',on);buzz()};
$('#bSheet').onclick=e=>{const s=$('#sheet');s.hidden=!s.hidden;e.currentTarget.classList.toggle('on',!s.hidden);buzz()};
$('#bFlip').onclick=()=>{facing=facing==='user'?'environment':'user';buzz(12);start(true)};
function focusAt(x,y){
 const f=caps.focusMode;if(!f||!(f.includes('single-shot')||f.includes('continuous')||f.includes('manual')))return;
 const r=$('#ring');r.style.left=x+'px';r.style.top=y+'px';r.classList.remove('go');void r.offsetWidth;r.classList.add('go');buzz(6);
 const nx=x/stage.clientWidth;adv({focusMode:f.includes('single-shot')?'single-shot':'continuous',pointsOfInterest:[{x:mir?1-nx:nx,y:y/stage.clientHeight}]});
}
/* ---------- overlay ---------- */
function applyOv(){
 oi.style.transform=`translate(-50%,-50%) translate(${ov.x}px,${ov.y}px) rotate(${ov.r}rad) scale(${ov.flip?-ov.s:ov.s},${ov.s})`;
 oi.style.opacity=ov.hide?0:ov.o;
}
function resetOv(){Object.assign(ov,{x:0,y:0,s:1,r:0,flip:false});applyOv()}
$('#thumb').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{
  if(oi.dataset.u)URL.revokeObjectURL(oi.dataset.u);oi.dataset.u=u;oi.src=u;
  ov.bw=Math.min(innerWidth*.8,460);ov.bh=ov.bw*im.naturalHeight/im.naturalWidth;oi.style.width=ov.bw+'px';oi.style.height=ov.bh+'px';
  ov.on=true;ov.hide=false;ov.o=.5;$('#opa').value=50;$('#oo').textContent='50%';oi.hidden=false;resetOv();
  $('#ovbar').hidden=false;$('#bHide').lastChild.textContent='Hide';
  $('#thumb').innerHTML='<img src="'+u+'" alt="">';buzz(10);toast('Pinch, drag & rotate to match the pose');
 };
 im.onerror=()=>toast('Couldn’t open that image');im.src=u;e.target.value='';
};
$('#opa').oninput=e=>{ov.o=e.target.value/100;$('#oo').textContent=e.target.value+'%';if(ov.hide){ov.hide=false;$('#bHide').lastChild.textContent='Hide'}applyOv()};
$('#bMir').onclick=()=>{ov.flip=!ov.flip;applyOv();buzz()};
$('#bRes').onclick=()=>{resetOv();buzz(12)};
$('#bHide').onclick=e=>{ov.hide=!ov.hide;e.currentTarget.lastChild.textContent=ov.hide?'Show':'Hide';applyOv();buzz()};
$('#bDel').onclick=()=>{ov.on=false;oi.hidden=true;$('#ovbar').hidden=true;$('#thumb').innerHTML=ic('image').replace('<svg','<svg width="26" height="26"');buzz(12)};
/* gestures */
const pts=new Map();let base=null,tap=null;
function rebase(){
 const a=[...pts.values()];base={x:ov.x,y:ov.y,s:ov.s,r:ov.r};
 if(a.length===1)base.p=a[0];
 if(a.length===2)Object.assign(base,{m:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,a:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)});
}
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});tap=pts.size===1?{x:e.clientX,y:e.clientY,t:Date.now()}:null;rebase()};
stage.onpointermove=e=>{
 if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap=null;
 if(!ov.on||ov.hide||!base)return;const a=[...pts.values()];
 if(a.length===1&&base.p){ov.x=base.x+a[0].x-base.p.x;ov.y=base.y+a[0].y-base.p.y}
 else if(a.length===2&&base.m){
  const m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),ang=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x);
  ov.s=Math.min(6,Math.max(.15,base.s*d/base.d));ov.r=base.r+(ang-base.a)*(ov.flip?-1:1)*(ov.flip?1:1);ov.x=base.x+m.x-base.m.x;ov.y=base.y+m.y-base.m.y;
 }
 applyOv();
};
const up=e=>{if(tap&&Date.now()-tap.t<350&&e.type==='pointerup')focusAt(tap.x,tap.y);tap=null;pts.delete(e.pointerId);rebase()};
stage.onpointerup=up;stage.onpointercancel=up;
stage.addEventListener('wheel',e=>{if(!ov.on)return;e.preventDefault();ov.s=Math.min(6,Math.max(.15,ov.s*(e.deltaY<0?1.06:.94)));applyOv()},{passive:false});
/* ---------- capture ---------- */
$('#shutter').onclick=async()=>{
 if(!track||busy)return;busy=true;buzz(15);const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
 try{
  let blob=null;
  if(window.ImageCapture){try{
   const c=new ImageCapture(track),o={};
   try{const pc=await c.getPhotoCapabilities();if(pc.imageWidth&&pc.imageWidth.max)o.imageWidth=pc.imageWidth.max;if(pc.imageHeight&&pc.imageHeight.max)o.imageHeight=pc.imageHeight.max}catch(e){}
   blob=await c.takePhoto(o);
  }catch(e){blob=null}}
  if(!blob){
   const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
   blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.98));
  }
  const bmp=await createImageBitmap(blob);
  shot={blob,w:bmp.width,h:bmp.height,mir,W:stage.clientWidth,H:stage.clientHeight,url:URL.createObjectURL(blob),ovs:ov.on&&!ov.hide?{...ov,src:oi.src}:null};bmp.close&&bmp.close();
  incl=false;showReview();
 }catch(e){toast('Couldn’t capture photo')}
 busy=false;
};
async function compose(){
 const bmp=await createImageBitmap(shot.blob),{w,h,W,H,ovs}=shot,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.save();if(shot.mir){x.translate(w,0);x.scale(-1,1)}x.drawImage(bmp,0,0);x.restore();
 const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=ovs.src}),k=Math.max(W/w,H/h);
 x.setTransform(1/k,0,0,1/k,-((W-w*k)/2)/k,-((H-h*k)/2)/k);
 x.translate(W/2+ovs.x,H/2+ovs.y);x.rotate(ovs.r);x.scale(ovs.flip?-ovs.s:ovs.s,ovs.s);x.globalAlpha=ovs.o;x.drawImage(im,-ovs.bw/2,-ovs.bh/2,ovs.bw,ovs.bh);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.98));
}
async function refresh(){
 let b=shot.blob,u=shot.url;
 if(incl&&shot.ovs){try{if(!shot.cb)shot.cb=await compose();b=shot.cb;u=shot.cu||(shot.cu=URL.createObjectURL(b))}catch(e){incl=false;toast('Couldn’t add overlay')}}
 shot.out=b;$('#rimg').src=u;$('#bInc').classList.toggle('on',incl);$('#bInc').style.background=incl?'rgba(255,214,10,.85)':'';$('#bInc').style.color=incl?'#000':'';
 $('#info').textContent=`${shot.w} × ${shot.h} · ${(b.size/1048576).toFixed(1)} MB${incl?' · with overlay':''}`;
}
function showReview(){$('#bInc').hidden=!shot.ovs;$('#rev').hidden=false;refresh();stream&&stream.getTracks().forEach(t=>t.enabled=false)}
$('#bInc').onclick=()=>{incl=!incl;buzz();refresh()};
$('#bRetake').onclick=()=>{buzz(10);$('#rev').hidden=true;[shot.url,shot.cu].forEach(u=>u&&URL.revokeObjectURL(u));shot=null;stream&&stream.getTracks().forEach(t=>t.enabled=true);if(!stream||!stream.active)start()};
$('#bSave').onclick=async()=>{
 const b=shot.out,f=new File([b],`pose-${Date.now()}.jpg`,{type:b.type||'image/jpeg'});buzz(12);
 try{
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Pose Camera'});toast('Choose “Save Image” to add to Photos');return}
 }catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 toast('Saved at full quality');
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#rev').hidden&&!blocked&&(!stream||!stream.active))start()});
if(location.hash==='#debug'){const c=document.createElement('div');c.className='g';c.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 2px);padding:3px 10px;border-radius:99px;font-size:10px;z-index:40;pointer-events:none;white-space:nowrap';c.textContent=envLabel();document.body.appendChild(c)}
start();
</script>
</body>
